<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Expenses chart component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    My balance $921.48 Spending - Last 7 days mon tue wed thu fri sat sunss
    Total this month $478.33 +2.4% from last month
    <div id="bar-chart"></div>

    <script>
      const data = [
        { day: "mon", amount: 17.45 },
        { day: "tue", amount: 34.91 },
        { day: "wed", amount: 52.36 },
        { day: "thu", amount: 31.07 },
        { day: "fri", amount: 23.39 },
        { day: "sat", amount: 43.28 },
        { day: "sun", amount: 25.48 },
      ];
      // use data here

      const barChart = document.getElementById("bar-chart");
      data.forEach((item) => {
        const barGroup = document.createElement("div");
        const bar = document.createElement("div");
        bar.classList.add("bar");
        const label = document.createElement("p");
        label.classList.add("label");
        label.textContent = item.day;
        bar.style.height = `${item.amount * 3}px`;

        if (item.day === "wed") {
          bar.style.backgroundColor = "hsl(186, 34%, 60%)";
        }
        barGroup.appendChild(bar);
        barGroup.appendChild(label);
        barChart.appendChild(barGroup);
      });

      /* 
      <div> 
            <div class="bar"></div>
            <p>mon</p> 
        </div> 

      */
    </script>
    <style>
      #bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 200px;
        border: 1px solid #ccc;
        padding: 10px;
      }
      #bar-chart .bar {
        width: 30px;
        background-color: hsl(10, 79%, 65%);
      }
      #bar-chart p {
        margin: 0;
        text-align: center;
        font-size: 0.875rem;
      }
      .label {
        margin-top: 10px;
        color: green;
      }
    </style>
  </body>
</html>
