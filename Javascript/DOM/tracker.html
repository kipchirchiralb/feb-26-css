<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Progress Tracker</h1>
    <progress value="10" max="100"></progress> <br />

    <textarea name="output" id="output"></textarea> <br />
    <button id="one">1</button>
    <button id="two">2</button>
    <button id="three">3</button>
    <button id="add">+</button>
    <button id="multiply">*</button>
    <button id="equalsign">=</button>

    <script>
      setInterval(() => {
        const progress = document.querySelector("progress");
        if (progress.value >= 100) {
          progress.value = 0;
        }
        progress.value += 10;
      }, 400);

      document.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const output = document.querySelector("#output");

          if (e.target.id === "equalsign") {
            const result = eval(output.value);
            if (!isNaN(result)) {
              output.value = result;
            } else {
              output.value = "Syntax Error";
            }
          } else {
            output.value += e.target.textContent;
          }

          e.target.style.backgroundColor = "yellow";
        });
      });
    </script>
  </body>
</html>
